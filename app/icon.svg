<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181528" />
      <stop offset="100%" stop-color="#090812" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A45" />
      <stop offset="50%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FF8C00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#FF5722" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Squircle Background -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#sqBg)" stroke="#FF5722" stroke-opacity="0.45" stroke-width="2.2" />
  
  <!-- Subtle Inner Border -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="14" fill="none" stroke="#FF7A45" stroke-opacity="0.15" stroke-width="1.2" />

  <!-- Bold Modern "S" Monogram -->
  <path d="M42 22 C42 15.5 35.5 13.5 29.5 13.5 C20.5 13.5 18 18.5 18 24.5 C18 34.5 40 32 40 41.5 C40 47.5 35 50.5 28.5 50.5 C21.5 50.5 17.5 45.5 17.5 40.5" 
        fill="none" 
        stroke="url(#brandGrad)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Signature Orange Dot (matching navbar Shashidhar P C •) -->
  <circle cx="49" cy="15" r="4.5" fill="#FF5722" />
  <circle cx="49" cy="15" r="2" fill="#FFE0B2" />
</svg>
